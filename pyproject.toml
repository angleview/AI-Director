[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-director-lab"
version = "0.1.0"
description = "A replayable and measurable edge vision pipeline for Raspberry Pi"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Director Lab" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
inference = [
    "numpy==2.2.4",
    "opencv-python==4.12.0.88",
    "ultralytics==8.3.232",
    "ncnn==1.0.20250916",
    "torch==2.9.1",
    "torchvision==0.24.1",
]

[project.scripts]
edge-ai-director-demo = "edge_ai_director.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
